msrv = "1.97.0"
doc-valid-idents = [
  "Aider",
  "Axum",
  "Claude",
  "Codex",
  "JSON",
  "LLM",
  "OpenAI",
  "Rust",
  "SQLite",
  "TUI",
  "WebSocket",
  "XDG",
]
# Align with rust-strict / AGENTS drift profile (≤ 6 params).
too-many-arguments-threshold = 6
type-complexity-threshold = 250
# Production forbids panic! via package `clippy::panic = deny`; tests may panic.
allow-panic-in-tests = true
